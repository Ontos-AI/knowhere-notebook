      "type": "table",
      "content": "<table><tr><td rowspan=\"3\">Profitability</td><td>$4.4B GAAP operating income in 2025; $1.4B in Q4</td><td rowspan=\"3\">2025 marked a critical year for Tesla as we further expanded our mission and continued our transition from a hardware-centric business to a physical AI company. We laid the foundation for the future of Tesla as we further advanced FSD (Supervised)4, launched our Robotaxi service, began installing production lines for Cybercab and fine-tuned our production-primed Optimus design while expanding our AI training infrastructure.</td></tr><tr><td>$3.8B GAAP net income in 2025; $0.8B in Q4</td></tr><tr><td>$5.9B non-GAAP net income1 in 2025; $1.8B in Q4</td></tr><tr><td rowspan=\"3\">Cash</td><td>Operating cash flow of $14.7B in 2025; $3.8B in Q4</td><td>Our approach to autonomous vehicles and humanoid robots mirrors the way we approached electric vehicles and energy storage – at the system level where we identify the limiting factor and develop bespoke and scalable solutions (batteries, power electronics, inverters, software, Al silicon, etc.) to optimize for cost, functionality, efficiency and safety. Our vertical integration has enabled us to achieve economies of scale in a profitable manner, quickly troubleshoot bottlenecks in production and iteratively optimize our technologies more rapidly than others.</td></tr><tr><td>Free cash flow2 of $6.2B in 2025; $1.4B in Q4</td><td rowspan=\"2\">In 2025, we completed the refresh of our vehicle lineup with the launch of the new Model Y, including additional variants. We believe that maintaining an optimized and efficient product portfolio, with a continued focus on high-value features such as long range, best-in-class software and autonomy, is the correct strategy to win the autos market of the future. Similarly, we continued to evolve our energy offerings for commercial, utility and retail customers, as we position ourselves as a supplier of choice for clean, affordable and rapidly deployable energy capacity ahead of expected sustained demand growth for electricity.</td></tr><tr><td>$7.5B increase in our cash and investments3 in 2025 to $44.1B</td></tr><tr><td rowspan=\"3\">Operations</td><td>Began removing safety monitor from our Robotaxis in Austin in January</td><td rowspan=\"3\">In 2026, we will further invest in the infrastructure needed to support clean energy and transport and autonomous robots, including the ramp of six new production lines across vehicle, robots, energy storage and battery manufacturing, while further leveraging our existing factory, charging and service center footprint to support future growth.</td></tr><tr><td>Record Q4 &amp; FY&#x27;25 energy storage deployments</td></tr><tr><td>Record vehicle deliveries in APAC</td></tr></table>",

      "chunk_id": "859c942e-323f-567c-8c1c-181fef603ccc",
      "type": "text",
      "content": "\nWhile automotive sales declined sequentially, gross margin (even when excluding the impact of regulatory credits) improved. The APAC region continued to show strength across multiple markets and set a record for deliveries in the quarter. We continued the rollout of Model Y variants across markets in Q4, including the standard and performance versions.\n\nPreparations continue in North America for the production ramps of Tesla Semi and Cybercab, both commencing 1H26, and production of the next-generation Roadster.\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->Automotive",

    {
      "chunk_id": "277f6411-3a47-5b21-8ffe-b084a9b714bd",
      "type": "text",
      "content": "\nWe achieved our highest quarterly energy storage deployments, driven by record Megapack deployments. Total gross profit rose, both sequentially and year-over-year, to a record $1.1 billion, marking the fifth consecutive record quarter. We plan to begin Megapack 3 and Megablock production at Megafactory Houston in 2026. In 2025, our global Powerwall network supported more than 89,000 Virtual Power Plant events across over 1 million installed units, allowing homeowners to save over $1 billion in electricity bills as Virtual Power Plant participation continues to scale rapidly.\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->Energy generation and storage",
      "metadata": {
        "length": 583,

      "chunk_id": "229ae57a-79ef-57d9-a50f-2e5d5fd10743",
      "type": "text",
      "content": "\nWe made further progress on the Optimus program in 2025. In Q1 of this year, we plan to unveil the Gen 3 version of Optimus, which will include major upgrades from version 2.5, including our latest hand design. The Gen 3 is our first design meant for mass production. Preparations are underway for the first production line, including supply chain readiness, with start of production planned before the end of 2026 and eventual planned capacity of 1 million robots per year.\n\nInstalled Annual Manufacturing Capacity\n\ntable-6\n特斯拉各工厂产能与状态概览：汽车产品包括Model 3/Y、S/X、Cybertruck等在不同地区生产；能源产品如Megapack、Powerwall在多地投产；机器人Optimus在建设中。\nTABLE_cdae270e-2dc4-5edc-9876-26a9454fbfff_TABLE\n\nInstalled capacity $\\neq$ current production rate and there may be limitations discovered as production rates approach capacity. Production rates depend on a variety of factors, including equipment uptime, component supply, downtime related to factory upgrades, regulatory considerations and other factors. Construction includes factory and infrastructure buildup as well as tool installation.\n",

    {
      "chunk_id": "b5709188-2bc7-5134-954f-6b4da7dcdd5b",
      "type": "text",
      "content": "\nWe are currently building Cortex 2 at Gigafactory Texas to further increase our AI training compute capacity. In the first half of 2026, we plan to more than double the size of onsite compute in Texas (in terms of H100 equivalents). We aim to maximize capital efficiency by scaling training compute judiciously, including when the training backlog gets too long or in anticipation of greater demand from our engineers to support our AI-related offerings.\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->AI Training Compute",

      }
    },
    {
      "chunk_id": "ed7819d9-1101-5c4e-aba4-b3a381016b90",
      "type": "text",
      "content": "\nOur lithium refinery commenced pilot production and is the first spodumene to lithium hydroxide refinery in North America, leveraging a simpler, cheaper and more environmentally friendly process. This refinery enables us to domestically produce critical minerals in support of energy storage, battery manufacturing and ultimately for EV growth.\n\nWe have begun to produce battery packs for certain Model Ys with our 4680 cells, unlocking an additional vector of supply to help navigate increasingly complex supply chain challenges caused by trade barriers and tariff risks. We now produce dry-electrode for 4680 cells with both anode and cathode made in Austin. We expect both domestic cathode material in Texas and LFP lines in Nevada to begin production in 2026.\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->Battery",

    {
      "chunk_id": "f8098618-e5be-52ce-b62d-b1e72d1c63d4",
      "type": "text",
      "content": "\nWe continue to efficiently utilize our existing physical footprint in North America, with targeted augmentation to support the rollout of Robotaxi. While in the short-term, operational workstreams such as charging, cleaning and maintenance can be managed through our existing charging network, service centers and sales and delivery locations, we will have to add more capacity as the service expands. We added over 3,800 net new Supercharging stalls, growing the network $19\\%$ year-over-year.\n\nInstalled Annual Capacity\n\ntable-7\nThe table lists AI training compute and battery manufacturing facilities by region, product, capacity, and status. Key data includes Texas Cortex 1 (>100k H100e, Production) and Texas 4680 battery (40 GWh, Production).\nTABLE_0428af2c-bf5d-54a6-a142-09ec146d027e_TABLE\n\nInstalled capacity $\\neq$ current production rate and there may be limitations discovered as production rates approach capacity. Production rates depend on a variety of factors, including equipment uptime, component supply, downtime related to factory upgrades, regulatory considerations and other factors. Construction includes factory and infrastructure buildup as well as tool installation.\n\nimage-1\nThe graph illustrates the Tesla AI Training Capacity Ramp, showing two lines: \"Existing Capacity\" and \"Future Planned Capacity,\" measured in H100 equivalent GPUs. The x-axis represents time from June 2021 to June 2026, while the y-axis measures capacity up to 300,000 GPUs. Existing Capacity remains relatively flat until mid-2023, after which it increases steadily. Future Planned Capacity starts at zero and shows a sharp increase towards the end of the timeline, surpassing existing capacity significantly by June 2026.\nIMAGE_ea4cef09-8ff1-5ec6-812f-1bb6f463779a_IMAGE\n",

    {
      "chunk_id": "276f4634-f601-50fd-a6fc-00b4adff4f95",
      "type": "text",
      "content": "\nWe continue to enhance FSD (Supervised)<sup>1</sup> via our end-to-end foundation model trained on both customer and Robotaxi real-world data with our latest version, v14. FSD (Supervised)<sup>1</sup> increasingly provides safety and convenience functionality that can relieve drivers of many tedious and potentially dangerous aspects of road travel, including giving access to personal transport for those who otherwise have difficulty driving. V14 offers unparalleled driver assistance to safely drive to the customer's destination, find a free parking spot and park at that location. Our global fleet can collect the equivalent of over 500 years of continuous driving data per day<sup>2</sup>, allowing us to safely deploy and scale capabilities that can handle the long and fat tail of corner cases across diverse geographies and driving environments.\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->AI Software",

    {
      "chunk_id": "94bec0b2-d11e-52f6-ac8b-504be5cd4142",
      "type": "text",
      "content": "\nDevelopment of our in-house, custom designed AI5 and AI6 inference chips for autonomy progressed during the quarter, with production planned for 2027 and 2028, respectively. We are targeting a 50x improvement in performance for AI5 relative to AI4 thanks to 10x raw compute, 9x memory capacity and 5x hardened block quantization and softmax function (the latter enabling efficient low-precision computing without sacrificing model accuracy).\n",
      "path": "Default_Root/TSLA-Q4-2025-Update.pdf-->OPERATIONAL SUMMARY-->AI Inference Compute",

      "chunk_id": "b5fef3b1-d6fa-5fea-b82d-171557c050be",
      "type": "image",
      "content": "\nimage-2\nThe image is a line graph showing the growth of FSD (Full Self-Driving) miles over time, divided into two categories: FSD miles on V12 and beyond (red area) and FSD miles on V11 and before (blue area). The x-axis represents time from September 2021 to December 2025, while the y-axis represents the number of miles in increments of 1.0 up to 8.0. The red area grows significantly over time, indicating an increase in FSD miles on V12 and beyond, while the blue area remains relatively small and stable.\nIMAGE_b5fef3b1-d6fa-5fea-b82d-171557c050be_IMAGE\n",
      "path": "images/image-2-We continu.jpg",

      "type": "text",
      "content": "\nThe Robotaxi iOS app no longer has a waitlist in the areas we serve. Our vehicles keep getting better with our over-the-air updates, including: Grok (an AI companion) which now supports navigation commands (allowing users to find, add and edit navigation destinations hands-free); Tesla Photobooth which enables users to take photos in their car and download or share via the Tesla mobile app; Supercharger Site Maps which displays Supercharger layouts, nearby businesses and live availability details; Automatic HOV Lane Routing based on interior camera occupancy detection; Phone Left Behind Chime and SpaceX ISS Docking Simulator Game.\n\nimage-2\nThe image is a line graph showing the growth of FSD (Full Self-Driving) miles over time, divided into two categories: FSD miles on V12 and beyond (red area) and FSD miles on V11 and before (blue area). The x-axis represents time from September 2021 to December 2025, while the y-axis represents the number of miles in increments of 1.0 up to 8.0. The red area grows significantly over time, indicating an increase in FSD miles on V12 and beyond, while the blue area remains relatively small and stable.\nIMAGE_b5fef3b1-d6fa-5fea-b82d-171557c050be_IMAGE\n\nimage-3\nThe image showcases a Tesla silicon chip with a focus on its optimization improvements. Key enhancements include a 5x increase in hardened block quantization and softmax, a 9x boost in memory capacity, a 10x rise in raw compute, and an overall 50x improvement compared to AI4. The chip is depicted with a detailed view of its internal components and connections.\nIMAGE_b1def06a-9baf-5e8f-98ee-8decac860bda_IMAGE\n\nCumulative Miles Driven with FSD (Supervised)<sup>1</sup> (billions)\n\nTargeting Step-Function Improvement for our Next-Generation Inference Chip, AI5\n\n(1) Active driver supervision required; does not make the vehicle autonomous\n\n(2) Calculated based on continuous hours of driving at an average of 30 miles per hour\n",

      "chunk_id": "bea86cc6-7304-521d-bebf-45769e02f8fd",
      "type": "text",
      "content": "\nServices and Other gross profit of approximately $300 million was partly driven by Part Sales and Supercharging. We now offer Tesla Insurance in Florida, as we continue to expand our insurance product to new states. In certain states, customers receive a discount on their insurance premiums when using FSD (Supervised)1. The more you drive with FSD (Supervised)1 enabled, the bigger the discount is on your insurance premium – helping, in certain cases, to completely offset the monthly subscription cost for FSD (Supervised)1.\n\nimage-4\nThe image is a line graph showing a steady increase over time from June 2025 to December 2025. The y-axis represents values ranging from 0 to 700,000, and the x-axis represents months from June to December 2025. The area under the line is filled in blue, indicating a growing trend.\nIMAGE_7761e287-42d9-53ef-a8ca-f034f250c746_IMAGE\n\nCumulative Paid Robotaxi Miles\n\nPlanned Robotaxi Coverage\n\ntable-8\n该表格列出了美国多个州及城市的地铁自动驾驶状态，包括加州（安全驾驶员）、德州（奥斯汀正在推进无人驾驶，达拉斯和休斯顿计划2026年上半年）以及其他州城市计划在2026年上半年实施。\nTABLE_d4b47369-e206-5d49-afdd-db918ddee012_TABLE\n",

      "chunk_id": "16f03515-3d5e-5e29-9cb6-a9b9717fd0f0",
      "type": "text",
      "content": "\nOn January 16, 2026, Tesla entered into an agreement to invest approximately $2 billion to acquire shares of Series E Preferred Stock of xAI as part of their recent publicly-disclosed financing round. Tesla's investment was made on market terms consistent with those previously agreed to by other investors in the financing round. As a set forth in Master Plan Part IV, Tesla is building products and services that bring AI into the physical world. Meanwhile, xAI is developing leading digital AI products and services, such as its large language model (Grok).\n\nIn that context, and as part of Tesla's broader strategy under Master Plan Part IV, Tesla and xAI also entered into a framework agreement in connection with the investment. Among other things, the framework agreement builds upon the existing relationship between Tesla and xAI by providing a framework for evaluating potential AI collaborations between the companies. Together, the investment and the related framework agreement are intended to enhance Tesla's ability to develop and deploy AI products and services into the physical world at scale. This investment is subject to customary regulatory conditions with the expectation to close in Q1'2026.\n",

      "type": "text",
      "content": "\nTotal quarterly revenue decreased $3 \\%$ YoY to $\\$ 24.9$ B. YoY, revenue was impacted by the following items $^{(1)}$ :\n\n- decrease in vehicle deliveries\n\n- lower regulatory credit revenue\n\n+ growth in Energy Generation and Storage\n\n+ growth in Services and Other\n\n+ positive FX impact of $\\$ 0.3$ B $^{1}$\n\n+ growth in other automotive ancillary sales, partly driven by an increase in FSD subscriptions\n\n+ higher vehicle average selling price (ASP) (excl. FX impact $^1$ ), inclusive of mix impact\n",

    {
      "chunk_id": "b548cc35-15a1-5f75-a882-bf55f71de259",
      "type": "text",
      "content": "\nOur quarterly operating income decreased $11 \\%$ YoY to $\\$ 1.4$ B, resulting in a $5.7 \\%$ operating margin. YoY, operating income was primarily impacted by the following items $^{(1)}$ :\n\n- increase in SBC and Restructuring and Other charges\n\n- increase in operating expenses (excl. SBC and Restructuring and Other) driven by AI and other R&D projects and SG&A\n\n- higher average cost per vehicle due to lower fixed cost absorption for certain models and an increase in tariffs\n\n- decrease in vehicle deliveries\n\n- lower regulatory credit revenue\n\n+ higher vehicle average gross profit due to mix and pricing impacts\n\n+ growth in Energy Generation and Storage gross profit\n\n+ growth in Services and Other gross profit\n\n+ growth in other automotive ancillary sales, partly driven by an increase in FSD subscriptions\n",

      "chunk_id": "cdce3fce-6492-56b6-b225-d609711d6f73",
      "type": "text",
      "content": "\nWhen used in this update, certain terms have the following meanings. Our vehicle deliveries include only vehicles that have been transferred to end customers with all paperwork correctly completed. Our energy product deployment volume includes both customer units when installed and equipment sales at time of delivery. \"Net income attributable to common stockholders (non-GAAP)\" is equal to (i) net income attributable to common stockholders before (ii)(a) stock-based compensation expense, net of tax, (b) digital assets (gain) loss, net of tax and (c) release of valuation allowance on deferred tax assets. \"Adjusted EBITDA (non-GAAP)\" is equal to (i) net income attributable to common stockholders before (ii)(a) interest expense, (b) provision for (benefit from) income taxes, (c) depreciation, amortization and impairment, (d) stock-based compensation expense and (e) digital assets loss (gain), net. \"Free cash flow\" is operating cash flow less capital expenditures. Average cost per vehicle is cost of automotive sales divided by new vehicle deliveries (excluding operating leases). \"Days sales outstanding\" is equal to (i) average accounts receivable, net for the period divided by (ii) total revenues and multiplied by (iii) the number of days in the period. \"Days payable outstanding\" is equal to (i) average accounts payable for the period divided by (ii) total cost of revenues and multiplied by (iii) the number of days in the period. \"Days of supply\" is calculated by dividing new car ending inventory by the relevant period's deliveries and using trading days. Constant currency impacts are calculated by comparing actuals against current results converted into USD using average exchange rates from the prior period.\n",

      "chunk_id": "181bbf05-e78a-515c-b8c7-6bf351d505df",
      "type": "text",
      "content": "\nConsolidated financial information has been presented in accordance with GAAP as well as on a non-GAAP basis to supplement our consolidated financial results. Our non-GAAP financial measures include non-GAAP net income (loss) attributable to common stockholders, non-GAAP net income (loss) attributable to common stockholders on a diluted per share basis (calculated using weighted average shares for GAAP diluted net income (loss) attributable to common stockholders), Adjusted EBITDA margin, non-GAAP automotive gross margin and free cash flow. These non-GAAP financial measures also facilitate management's internal comparisons to Tesla's historical performance as well as comparisons to the operating results of other companies. Management believes that it is useful to supplement its GAAP financial statements with this non-GAAP information because management uses such information internally for its operating, budgeting and financial planning purposes. Management also believes that presentation of the non-GAAP financial measures provides useful information to our investors regarding our financial condition and results of operations, so that investors can see through the eyes of Tesla management regarding important financial metrics that Tesla uses to run the business and allowing investors to better understand Tesla's performance. Non-GAAP information is not prepared under a comprehensive set of accounting rules and therefore, should only be read in conjunction with financial information reported under U.S. GAAP when understanding Tesla's operating performance. A reconciliation between GAAP and non-GAAP financial information is provided above.\n",

      "type": "text",
      "content": "\nCertain statements in this update, including, but not limited to, statements in the \"Outlook\" section; statements relating to the development, strategy, ramp, production and capacity, demand and market growth, cost, pricing and profitability, investment, deliveries, deployment, availability and other features and improvements and timing of existing and future Tesla products and services and supporting infrastructure; statements regarding operating margin, operating profits, spending and liquidity; and statements regarding expansion, improvements and/or ramp and related timing at our facilities are \"forward-looking statements\" within the meaning of the Private Securities Litigation Reform Act of 1995. Forward-looking statements are based on assumptions and management's current expectations, involve certain risks and uncertainties, and are not guarantees. Future results may differ materially from those expressed in any forward-looking statement. The following important factors, without limitation, could cause actual results to differ materially from those in the forward-looking statements: the risk of delays in launching and/or manufacturing our products, services and features cost-effectively; our ability to build and/or grow our products and services, sales, installation, servicing and charging capabilities and effectively manage this growth; our ability to successfully and timely develop, introduce and scale, as well as our consumers' demand for, products and services based on artificial intelligence, robotics and automation, electric vehicles, advanced driver assistance systems, and ride-hailing services generally and our vehicles and services specifically; the ability of suppliers to deliver components according to schedules, prices, quality and volumes acceptable to us, and our ability to manage such components effectively; any issues with lithium-ion cells or other components manufactured at our factories; our ability to ramp our factories in accordance with our plans; our ability to procure supply of battery cells, including through our own manufacturing; risks relating to international operations and expansion, including unfavorable and uncertain regulatory, political, economic, tax, tariff, export controls and labor conditions; any failures by Tesla products to perform as expected or if product recalls occur; the risk of product liability claims; competition in the automotive, transportation and energy product and services and robotics markets; our ability to maintain public credibility and confidence in our long-term business prospects; our ability to manage risks relating to our various product financing programs; the status of government and economic incentives for electric vehicles and energy products; our ability to attract, hire and retain key employees and qualified personnel; our ability to maintain the security of our information and production and product systems; our compliance with various regulations and laws applicable to our operations and products, which may evolve from time to time; risks relating to our indebtedness and financing strategies; and adverse foreign exchange movements. More information on potential factors that could affect our financial results is included from time to time in our Securities and Exchange Commission filings and reports, including the risks identified under the section captioned \"Risk Factors\" in our annual report on Form 10-K filed with the SEC on January 30, 2025 and subsequent quarterly reports on Form 10-Q. Tesla disclaims any obligation to update information contained in these forward-looking statements whether as a result of new information, future events or otherwise.\n\nT 三 与 L 阿\n",

        // 转义HTML
        function escapeHtml(text) {
            const div = document.createElement('div');

        function renderTree() {
            const docTree = hierarchyData['Default_Root'] || {};
            document.getElementById('tree').innerHTML = renderNode(docTree, '');

        // 递归渲染节点
        function renderNode(node, parentPath) {
            let html = '';
            
            for (const [key, value] of Object.entries(node)) {
                const currentPath = parentPath ? `${parentPath}/${key}` : key;
                const fullPath = 'Default_Root/' + currentPath;
                const hasChildren = value && Object.keys(value).length > 0;
                const content = pathContentMap[fullPath] || '';
                
                html += '<div class="node">';
                
                if (hasChildren) {
                    html += `<div class="node-header" data-has-children="true">`;
                    html += `<span class="toggle">▼</span>`;
                    html += `<span class="label branch">${escapeHtml(key)}</span>`;
                    html += `</div>`;
                    html += `<div class="children" data-is-content="false">`;
                    html += renderNode(value, currentPath);
                    html += `</div>`;
                } else {
                    html += `<div class="node-header" data-has-children="false">`;
                    html += `<span class="toggle">▼</span>`;
                    html += `<span class="label">${escapeHtml(key)}</span>`;
                    html += `</div>`;
                    if (content) {
                        html += `<div class="children" data-is-content="true"><div class="content">${escapeHtml(content)}</div></div>`;
                    }
                }
                
                html += '</div>';
            }
            
            return html;
        }
        
        // 绑定事件
        function bindEvents() {
            document.querySelectorAll('.node-header').forEach(header => {
                header.addEventListener('click', function() {
                    const toggle = this.querySelector('.toggle');
                    const children = this.nextElementSibling;
                    
                    if (children && children.classList.contains('children')) {
                        if (children.classList.contains('collapsed')) {
                            children.classList.remove('collapsed');
                            toggle.classList.remove('collapsed');
                        } else {
                            children.classList.add('collapsed');
                            toggle.classList.add('collapsed');
                        }
                    }
                });
            });
        }
        
        // 展开内容：展开所有
        function expandAll() {
            document.querySelectorAll('.children').forEach(el => el.classList.remove('collapsed'));
            document.querySelectorAll('.toggle').forEach(el => el.classList.remove('collapsed'));
        }
        
        // 折叠内容：只折叠叶节点内容，保持树结构展开
        function collapseAll() {
            document.querySelectorAll('.children').forEach(el => {
                if (el.dataset.isContent === 'true') {
                    el.classList.add('collapsed');
                    const toggle = el.previousElementSibling?.querySelector('.toggle');
                    if (toggle) toggle.classList.add('collapsed');
                } else {
                    el.classList.remove('collapsed');
                    const toggle = el.previousElementSibling?.querySelector('.toggle');
                    if (toggle) toggle.classList.remove('collapsed');
                }
            });
        }
        
        renderTree();
